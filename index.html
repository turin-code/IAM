<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institute for Analytical Machines</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="paper paper-front">
    <header class="masthead">
      <h1>Institute for Analytical Machines</h1>
    </header>

    <section class="auth-section" aria-label="Login">
      <div id="active-session-box" class="hidden">
        <p class="small">
          Signed in as <strong id="active-student-id" class="mono"></strong>
          (<span id="active-role" class="mono"></span>)
        </p>
        <div class="btn-row">
          <a href="./portal.html" class="btn">Portal</a>
          <a id="active-admin-link" href="./write.html" class="btn btn-secondary hidden">Write Blog</a>
          <button id="signout-btn" type="button" class="btn btn-secondary">Sign Out</button>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="student-id">Student ID</label>
          <input
            id="student-id"
            name="studentId"
            type="text"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button id="login-submit" type="submit" class="btn">Sign In</button>
      </form>

      <div id="auth-status" class="status" role="status" aria-live="polite"></div>

      <div class="under-login-link">
        <a href="./blogs.html">Blogs</a>
      </div>
    </section>
  </main>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
