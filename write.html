<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Blog — Institute for Analytical Machines</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="paper">
    <header class="masthead">
      <h1>Institute for Analytical Machines</h1>
      <p class="subtitle">Write Blog</p>
    </header>

    <nav class="nav-bar" aria-label="Primary">
      <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./blogs.html">Blogs</a>
        <a href="./portal.html">Portal</a>
      </div>
      <div class="btn-row">
        <span id="writer-admin-id" class="small muted"></span>
        <button id="signout-btn" type="button" class="btn btn-secondary">Sign Out</button>
      </div>
    </nav>

    <div id="writer-status" class="status" role="status" aria-live="polite"></div>

    <section id="writer-content" class="hidden" aria-labelledby="compose-heading">
      <h2 id="compose-heading">1. Manuscript</h2>

      <form id="writer-form" class="panel-box">
        <div class="field">
          <label for="post-title">Title</label>
          <input id="post-title" type="text" required>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="post-slug">Slug</label>
            <input id="post-slug" type="text" required>
          </div>
          <div class="field">
            <label for="post-date">Date</label>
            <input id="post-date" type="text" required>
          </div>
        </div>

        <div class="field">
          <label for="post-summary">Abstract</label>
          <input id="post-summary" type="text" required>
        </div>

        <div class="field">
          <label for="post-markdown">Markdown</label>
          <textarea id="post-markdown" rows="12" required></textarea>
        </div>

        <div class="field">
          <label for="github-token">GitHub Token (Contents: Read &amp; Write)</label>
          <input id="github-token" type="password" autocomplete="off">
        </div>

        <div class="btn-row">
          <button id="publish-btn" type="submit" class="btn">Publish to GitHub</button>
          <button id="download-btn" type="button" class="btn btn-secondary">Download Files</button>
        </div>
      </form>

      <h2>2. Preview</h2>
      <article id="markdown-preview" class="article-body abstract"></article>
    </section>
  </main>

  <script type="module" src="./js/write.js"></script>
</body>
</html>
