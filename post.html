<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Institute for Analytical Machines</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="paper">
    <header class="masthead">
      <h1 id="post-title">Loading...</h1>
      <p class="subtitle">
        <span id="post-date"></span>
        <span id="post-author"></span>
      </p>
    </header>

    <nav class="nav-bar" aria-label="Primary">
      <div class="nav-links">
        <a href="./blogs.html">&larr; Blogs</a>
        <a href="./index.html">Login</a>
      </div>
      <span id="post-slug" class="muted small"></span>
    </nav>

    <div id="post-abstract" class="abstract hidden">
      <span class="abstract-label">Abstract</span>
      <span id="post-summary"></span>
    </div>

    <article id="post-body" class="article-body"></article>
    <div id="post-status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./js/post.js"></script>
</body>
</html>
